<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1c1610" />
      <stop offset="60%" stop-color="#0b0e14" />
      <stop offset="100%" stop-color="#050608" />
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fae29c" />
      <stop offset="50%" stop-color="#c8923a" />
      <stop offset="100%" stop-color="#8a5a14" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#241b12" />
      <stop offset="100%" stop-color="#0d0e12" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" />
  <rect width="500" height="500" x="6" y="6" rx="104" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-opacity="0.4" />

  <!-- Outer Shield Badge -->
  <path d="M256 70 L390 130 C390 260, 340 370, 256 420 C172 370, 122 260, 122 130 Z" fill="url(#shieldGrad)" stroke="url(#goldGrad)" stroke-width="8" filter="url(#glow)" />

  <!-- Inner Noir Elements: Magnifying Glass + Silhouette Mask -->
  <!-- Magnifying Glass Rim -->
  <circle cx="240" cy="210" r="75" fill="#12151d" stroke="url(#goldGrad)" stroke-width="10" />
  <!-- Glass Reflection -->
  <path d="M200 160 A65 65 0 0 1 285 180" fill="none" stroke="#fae29c" stroke-width="5" stroke-linecap="round" opacity="0.6"/>

  <!-- Secret Mask / Silhouette in Glass -->
  <path d="M200 215 C200 190, 280 190, 280 215 C275 240, 205 240, 200 215 Z" fill="#c8923a" opacity="0.9" />
  <ellipse cx="225" cy="215" rx="6" ry="4" fill="#07080c" />
  <ellipse cx="255" cy="215" rx="6" ry="4" fill="#07080c" />

  <!-- Handle of Magnifying Glass (angled dagger style) -->
  <path d="M295 265 L365 335 C372 342, 372 354, 365 361 C358 368, 346 368, 339 361 L269 291" fill="url(#goldGrad)" stroke="#5a3a0e" stroke-width="2" />
  <circle cx="360" cy="356" r="10" fill="#fae29c" />

  <!-- Star Embellishments -->
  <polygon points="256,92 260,104 272,105 263,113 266,125 256,118 246,125 249,113 240,105 252,104" fill="#fae29c" />
</svg>
